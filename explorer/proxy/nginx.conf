# The explorer proxy's main configuration: the stock nginx image's nginx.conf with the njs module loaded for the page-head
# filter (explorer/proxy/igneum-head.js). Mounted over /etc/nginx/nginx.conf by explorer/igneum-proxy.yml.
load_module modules/ngx_http_js_module.so;


user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
