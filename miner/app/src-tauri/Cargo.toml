[package]
name = "ember"
description = "Ember: the Igneum desktop miner (Tauri host, Rust supervisor, TypeScript interface)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["ignpow"]
ignpow = ["igneum-supervisor/ignpow"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
igneum-supervisor = { workspace = true }
igneum-worker-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
