[package]
name = "igneum-worker-cpu"
description = "A worker on the shared proof-of-work reference (pow/ref): every candidate the reference carries, on the CPU, for tests, verification and dev chains; not a mining target"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "igneum-worker-cpu"
path = "src/main.rs"

[dependencies]
libc = "0.2"
igneum-worker-proto = { workspace = true }
igneum-pow-sys = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
