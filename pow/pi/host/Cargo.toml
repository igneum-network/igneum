[package]
name = "igneum-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The proof pi of SPEC-R0A-v0.md section 0.9.1: prover, verifier, the ProofSystem trait and the pi vector tool"

[lib]
path = "src/lib.rs"

[features]
# prove: the prover (the guest ELF from pi-methods, risc0's local prover). Without it the crate is the verifier alone:
# the pinned PI_IMAGE_ID, the journal rule, the per-domain kind and bound, risc0's verify; no guest toolchain, no docker.
default = ["prove"]
prove = ["dep:pi-methods", "risc0-zkvm/default", "risc0-zkvm/prove"]

[[bin]]
name = "pi-vectors"
path = "src/bin/pi-vectors.rs"
required-features = ["prove"]

# the sealer's prover from files (domain 0 after the nonce; domain 1 the claim), the node's exec target (the protocol team)
[[bin]]
name = "pi-prove"
path = "src/bin/pi-prove.rs"
required-features = ["prove"]

# the hostile claim's proof from files (domain 1, K 1), for the wallet and the registry's fixtures (the product team, D-B15)
[[bin]]
name = "pi-claim"
path = "src/bin/pi-claim.rs"
required-features = ["prove"]

[dependencies]
pi-methods = { path = "../methods", optional = true }
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std"] }
blake3 = "1.8"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
# F-55 (the security review, 13:1x UK, 12 October 2026): the secret's process never dumps a core and its buffer never pages
# out: setrlimit, prctl and mlock through libc (MIT or Apache-2.0; in the lock already as risc0's dependency).
libc = "0.2"
