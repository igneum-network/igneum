[package]
name = "igneum-pi-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The node's pi verifier: a C ABI over igneum-pi's verify (risc0 3.0.6 verifier, PI_IMAGE_ID pinned), as a staticlib behind cgo"

[lib]
name = "igneum_pi_ffi"
path = "src/lib.rs"
# staticlib only (no cdylib): with both beside each other the Go linker takes the .so and the test binary cannot load it
crate-type = ["staticlib", "rlib"]

[dependencies]
# the verifier alone: no guest, no prover, no docker (host/Cargo.toml's `prove` feature off)
igneum-pi = { path = "../host", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std"] }
