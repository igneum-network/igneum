[package]
name = "money-stage1-prover"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "money_stage1_prover"
path = "src/lib.rs"

[[bin]]
name = "money-witness"
path = "src/bin/money-witness.rs"

[[bin]]
name = "money-prove"
path = "src/bin/money-prove.rs"

[[bin]]
name = "money-vectors"
path = "src/bin/money-vectors.rs"

[[bin]]
name = "money-vault-vectors"
path = "src/bin/money-vault-vectors.rs"

[dependencies]
miden-vm = { version = "=0.36.1", features = ["concurrent"] }
miden-assembly = "=0.36.1"
miden-core = "=0.36.1"
miden-crypto = "=0.36.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
